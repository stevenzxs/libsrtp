name: Verify SM4-GCM adapter

on:
  workflow_dispatch:
  push:
    branches:
      - gm-libsrtp-v43.3.0
    tags:
      - 'v*-libsrtp-gm*'

jobs:
  compile-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout libsrtp
        uses: actions/checkout@v4

      - name: Checkout GM BoringSSL
        uses: actions/checkout@v4
        with:
          repository: stevenzxs/BoringSSL
          ref: v43.3.0-gm17
          path: boringssl
          fetch-depth: 1

      - name: Configure BoringSSL
        run: cmake -S boringssl -B boringssl/out -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF

      - name: Build BoringSSL crypto and SSL
        run: cmake --build boringssl/out --target crypto ssl --parallel 2

      - name: Compile SM4-GCM adapter
        run: |
          cc -std=c11 -DOPENSSL -DGCM -DHAVE_UINT64_T -DHAVE_UINT8_T \
            -DHAVE_UINT16_T -DHAVE_UINT32_T -DHAVE_INT32_T \
            -DHAVE_NETINET_IN_H \
            -I. -Iconfig -Iinclude -Icrypto/include \
            -Iboringssl/include \
            -c crypto/cipher/sm4_gcm_bssl.c \
            -o sm4_gcm_bssl.o

      - name: Run SM4-GCM adapter vector test
        run: |
          cc -std=c11 -DOPENSSL -DGCM -DHAVE_UINT64_T -DHAVE_UINT8_T \
            -DHAVE_UINT16_T -DHAVE_UINT32_T -DHAVE_INT32_T \
            -DHAVE_NETINET_IN_H \
            -I. -Iconfig -Iinclude -Icrypto/include \
            -Iboringssl/include \
            ci/sm4_gcm_adapter_test.c sm4_gcm_bssl.o \
            "$(find boringssl/out -name libcrypto.a -print -quit)" \
            -lpthread -ldl -o sm4_gcm_adapter_test
          ./sm4_gcm_adapter_test
